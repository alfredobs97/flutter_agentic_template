name: ui
description: >
  Presentation layer: widgets, screens, theming, routing and BLoCs/Cubits.
  MUST NEVER depend on `data` — see AGENTS.md section "Dependency rule".
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  domain:
    path: ../domain
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  intl: any

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
