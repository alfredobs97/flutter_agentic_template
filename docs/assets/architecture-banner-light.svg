<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"
     aria-label="Dependencies point only inward, toward domain: root wires up packages/data and packages/ui, both of which depend on packages/domain, but packages/ui and packages/data never import each other.">
  <title>flutter_agentic_template — dependency direction</title>
  <desc>
    root (lib/) instantiates packages/data and packages/ui. packages/data
    implements packages/domain's data-provider interfaces; packages/ui reads
    packages/domain's repositories. packages/ui and packages/data never
    import one another — that boundary is enforced by
    tool/check_architecture.dart.
  </desc>

  <defs>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1f24"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" font-weight="700" fill="#1b1f24">flutter_agentic_template</text>
  <text x="450" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" fill="#57606a">Clean Architecture on a Dart pub workspace</text>

  <!-- Arrows: root -> data, root -> ui -->
  <line x1="400" y1="152" x2="248" y2="230" stroke="#1b1f24" stroke-width="2" marker-end="url(#arrow-light)"/>
  <line x1="500" y1="152" x2="652" y2="230" stroke="#1b1f24" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="325" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">instantiates</text>
  <text x="575" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">instantiates</text>

  <!-- Arrows: data -> domain, ui -> domain -->
  <line x1="175" y1="292" x2="392" y2="372" stroke="#1b1f24" stroke-width="2" marker-end="url(#arrow-light)"/>
  <line x1="725" y1="292" x2="508" y2="372" stroke="#1b1f24" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="255" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">implements</text>
  <text x="645" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">reads via repository</text>

  <!-- Forbidden edge: ui and data never import each other -->
  <line x1="285" y1="262" x2="410" y2="262" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="494" y1="262" x2="615" y2="262" stroke="#cf222e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="452" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#cf222e">✕</text>
  <text x="452" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cf222e">never imported</text>

  <!-- Root box -->
  <rect x="345" y="92" width="210" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1b1f24">root (lib/)</text>
  <text x="450" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">composition root</text>

  <!-- Data box -->
  <rect x="70" y="232" width="210" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="175" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1b1f24">packages/data</text>
  <text x="175" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">external integrations</text>

  <!-- UI box -->
  <rect x="620" y="232" width="210" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="725" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1b1f24">packages/ui</text>
  <text x="725" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57606a">presentation</text>

  <!-- Domain box (accent) -->
  <rect x="335" y="372" width="230" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="399" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#3730a3">packages/domain</text>
  <text x="450" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4338ca">pure Dart core</text>

  <!-- Caption -->
  <text x="450" y="464" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#57606a">Dependencies point only inward, toward domain.</text>
  <text x="450" y="483" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#57606a">ui and data never import each other — enforced by tool/check_architecture.dart.</text>
</svg>
